<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Philterkaffee">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- Zwei Karten, nach unten schmaler: der Filter. -->
  <rect x="22" y="16" width="72" height="14" rx="5" fill="#ffffff"/>
  <rect x="33" y="37" width="50" height="14" rx="5" fill="#ffffff" opacity="0.78"/>
  <!-- Henkel zuerst, damit die Tasse sauber darueberliegt.
       Tasse links der Mitte, Henkel rechts: zusammen steht es mittig. -->
  <path d="M84 73 a15 15 0 0 1 0 26" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <!-- Tasse -->
  <path d="M30 64 L86 64 L80 96 Q77 108 65 108 L51 108 Q39 108 36 96 Z" fill="#ffffff"/>
  <!-- Kaffee -->
  <ellipse cx="58" cy="65" rx="25" ry="5" fill="#1e3a8a"/>
</svg>
